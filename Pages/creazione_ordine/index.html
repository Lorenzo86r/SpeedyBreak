<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Scolastico - Ordini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Bar Scolastico - Ordini</h1>
</header>

<main>
    <section id="menu">
        <h2>Menu</h2>
        <div class="items">
            <!-- Esempio prodotti -->
            <div class="item">
                <h3>Caffè</h3>
                <p>€1,50</p>
                <button onclick="addToCart('Caffè', 1.5)">Aggiungi al carrello</button>
            </div>
            <div class="item">
                <h3>Panino</h3>
                <p>€3,00</p>
                <button onclick="addToCart('Panino', 3.0)">Aggiungi al carrello</button>
            </div>
            <div class="item">
                <h3>Succo</h3>
                <p>€2,00</p>
                <button onclick="addToCart('Succo', 2.0)">Aggiungi al carrello</button>
            </div>
        </div>
    </section>

    <section id="cart">
        <h2>Carrello</h2>
        <ul id="cart-items"></ul>
        <p id="total">Totale: €0,00</p>
        <button onclick="checkout()">Conferma Ordine</button>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
